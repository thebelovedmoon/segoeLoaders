<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Spinners (legacy)</title>
    <link rel="icon" href="/segoeLoaders/assets/svg/msft.svg" type="image/x-icon">
    <link rel="apple-touch-icon" href="/segoeLoaders/assets/svg/msft.svg" type="image/x-icon">
    <!-- <link rel="icon" href="https://thebelovedmoon.github.io/assets/web/favicon/maria_1_icon.png" type="image/x-icon"> -->
    <!-- <link rel="apple-touch-icon" href="https://thebelovedmoon.github.io/assets/web/favicon/maria_1_icon.png" type="image/x-icon"> -->
    <style rel="stylesheet" type="text/css" media="all">
      @import url("/segoeLoaders/assets/css/responsive.css");

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
        -ms-word-wrap: break-word;
        word-wrap: break-word;
        scroll-behavior: smooth;
      }
      * { box-sizing: border-box; }

      html { background-color: black; }
      body {
        color: white;
        font-family: "Segoe Boot Semilight", sans-serif;
        * { margin: 0; }
      }

      a, a:visited {
        color: inherit;
        cursor: pointer;
        text-decoration: none;
      }
      a:hover, a:active { color: #bbb; }

      code {
        font-family: "Segoe Mono Boot", monospace;
        font-size: inherit;
        background-color: #ffffff20;
        padding: 0.15rem;
        -moz-border-radius: 4.75px;
        -ms-border-radius: 4.75px;
        -webkit-border-radius: 4.75px;
        -o-border-radius: 4.75px;
        border-radius: 4.75px;
      }

      p input[type="checkbox"] {
        width: 1.25em;
        height: auto;
        aspect-ratio: 1 / 1;
        display: inline-block;
        vertical-align: baseline;
      }

      .fullScrn {
        width: 100vw;
        height: 100vh;
        position: absolute;
        display: flex;
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .bgToggleScrn {
        width: 100vw;
        height: 100vh;
        position: absolute;
        .bgToggle {
          position: absolute;
          bottom: 1em;
          left: 1em;
          padding: 0.5rem 1rem;
          background-color: #00000080;
          border: calc(0.125em / 2) solid #00000080;
          border-radius: 8px;
        }
        .bgAttrib {
          position: absolute;
          bottom: 1em;
          right: 1em;
          font-size: 0.5em;
          padding: 0.5rem 1rem;
          background-color: #00000080;
          border: calc(0.125em / 2) solid #00000040;
          border-radius: 8px;
          text-align: right;
        }
      }
    </style>
    <script src="/segoeLoaders/assets/js/segoeLoaders.js" type="text/javascript"></script>
    <script type="text/javascript">
      let vrs = new URLSearchParams(window.location.search).get("version"),
        typ = new URLSearchParams(window.location.search).get("type"),
        spd = new URLSearchParams(window.location.search).get("speed"),
        sze = new URLSearchParams(window.location.search).get("size"),
        clr = new URLSearchParams(window.location.search).get("color");
      
      if (!vrs || !typ || !spd || !sze || !clr) {
        window.location.replace("?version=2&type=normal&speed=30&size=10em&color=ffffff");
      } else {
        document.addEventListener("DOMContentLoaded", () => {
          let sgLdr = document.querySelector(".segoeLdr");
          switch (vrs) {
            case "1":
            case "2":
              sgLdr.dataset.spinnerversion = vrs;
              break;
            default:
              window.location.replace("?version=2&type=normal&speed=30&size=10em&color=ffffff");
          }
          switch (typ) {
            case "normal":
            case "condensed":
              sgLdr.dataset.spinnertype = typ;
              break;
            default:
              window.location.replace("?version=2&type=normal&speed=30&size=10em&color=ffffff");
          }
          sgLdr.dataset.spinnerspeed = spd;
          sgLdr.parentElement.style.fontSize = sze;
          sgLdr.parentElement.style.color = `#${clr}`;
        });
      }

      function toggleBG() {
        let fScr = document.querySelector(".fullScrn"),
          tgle = document.querySelector("#bgTggl");
        
        if (tgle.checked == true) {
          tgle.checked = true;
          fScr.style.backgroundImage = `url('https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=en-US')`;
        } else {
          tgle.checked = false;
          fScr.style.backgroundImage = "none";
        }
      }
    </script>
  </head>
  <body onload="{ segoeLdrs('.segoeLdr'); }">
    <!-- AIO URL QUERY DEMONSTRATION -->
    <div class="fullScrn">
      <span class="segoeLdr"></span>
    </div>
    <div class="bgToggleScrn">
      <div class="bgToggle">
        <p><input type="checkbox" title="toggle background" id="bgTggl" onclick="{ toggleBG(); }">&ensp;toggle background</p>
      </div>
      <div class="bgAttrib">
        <p>Bing Daily Images powered by BitURL (locale: en-US)</p>
        <p>using js file: <code>segoeLoaders.js</code></p>
        <br>
        <p>this is a web demo based on the parameters of the first incarnation.</p>
        <p>
          curious?
          <a rel="noopener noreferrer" href="/segoeLoaders" target="_blank" style="text-decoration: underline;">see the main page.</a>
        </p>
      </div>
    </div>
  </body>
</html>
